# 构建「单机版」静态站点并发布到 GitHub Pages（项目站点：/<仓库名>/）。
# 只跑前端构建，不需要任何后端进程或密钥。
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 子路径按仓库名自动算，换仓库名不用改任何文件
      - name: Build static site
        run: npm run build:pages
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/

      # enablement: true —— 首次运行时由 workflow 自己把 Pages 打开
      # （省掉「去 Settings 里把 Source 改成 GitHub Actions」那一步）
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4